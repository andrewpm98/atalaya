[project]
name = "atalaya"
version = "0.1.0"
description = "Atalaya — Plataforma de Attack Surface Management (ASM) con triaje por IA"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andrew" }]

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Base de datos
    "sqlalchemy>=2.0",
    "greenlet>=3.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    # Descubrimiento / red
    "httpx>=0.27",
    "dnspython>=2.6",
    "cryptography>=42.0",
    # Almacén de CA de Mozilla para validar cadenas TLS (discovery/tls.py).
    # Llega con httpx; se declara porque se importa directamente.
    "certifi>=2024.2.2",
    # IA
    "anthropic>=0.34",
    "google-genai>=1.0",
    # Dashboard
    "streamlit>=1.37",
    # El dashboard lee API_KEY del .env (dashboard/app.py::_api_key). Ya
    # llegaba como dependencia de pydantic-settings; se declara porque se
    # importa directamente (mismo motivo que greenlet).
    "python-dotenv>=1.0",
    # Informes
    "jinja2>=3.1",
    "xhtml2pdf>=0.2.16",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
atalaya = "atalaya.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.flake8-bugbear]
# fastapi.Depends() en la firma de una ruta es el idiom estándar de
# inyección de dependencias de FastAPI, no una llamada mutable reusada
# por accidente entre invocaciones (lo que B008 previene de verdad).
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    # Levanta un servidor TLS en 127.0.0.1 (no sale de la maquina): tests/test_tls.py.
    "tls_local: prueba de integracion TLS contra un servidor local",
]

[[tool.mypy.overrides]]
# Sin stubs de tipos ni marcador py.typed — no es algo que se pueda
# arreglar en el código propio.
module = "xhtml2pdf.*"
ignore_missing_imports = true

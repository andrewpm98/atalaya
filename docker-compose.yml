# Stack completo: PostgreSQL + API + dashboard.
#
#   cp .env.example .env    # opcional: sin .env arranca igual, sin capa de IA
#   docker compose up --build -d
#
# Todos los puertos se publican solo en 127.0.0.1: la BD usa credenciales
# fijas de desarrollo y la autenticación de la API (API_KEY en .env) está
# desactivada por defecto, así que ninguno de los dos debe quedar accesible
# desde la red local.

services:
  db:
    image: postgres:16-alpine
    container_name: atalaya-db
    environment:
      POSTGRES_USER: atalaya
      POSTGRES_PASSWORD: atalaya
      POSTGRES_DB: atalaya
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atalaya -d atalaya"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: atalaya-api
    # Claves de IA/Shodan, SCAN_ALLOWLIST, API_KEY... Opcional: sin .env la API
    # arranca y solo los endpoints de IA responden 502 por falta de clave.
    env_file:
      - path: .env
        required: false
    environment:
      # Siempre el Postgres de este compose, diga lo que diga DATABASE_URL en
      # .env (que puede apuntar a SQLite o a localhost para desarrollo local):
      # `environment` tiene prioridad sobre `env_file`. Sin esto, un .env de
      # desarrollo hacía que la API usara SQLite dentro del contenedor.
      DATABASE_URL: postgresql+asyncpg://atalaya:atalaya@db:5432/atalaya
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src:/app/src
      - ./reports:/app/reports
    healthcheck:
      # python-slim no trae curl: se comprueba con la librería estándar.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: atalaya-dashboard
    # Sin env_file a propósito: el dashboard es un cliente HTTP puro de la API
    # y no necesita las claves de IA ni de Shodan. Mínimo privilegio: recibe
    # solo la clave de la propia API, interpolada desde el .env del proyecto
    # (vacía si no hay .env o no está definida = autenticación desactivada).
    environment:
      ATALAYA_API_URL: http://api:8000
      ATALAYA_API_KEY: ${API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./dashboard:/app/dashboard

volumes:
  pgdata:
